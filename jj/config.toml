"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"

[user]
name = "Gnanakeethan Balasubramaniam"
email = "gnanakeethan@cloudparallax.com"

[aliases]
l = ["log", "-r", "::"]
tug = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@"]
tug- = ["bookmark", "move", "--from", "heads(::@- & bookmarks())", "--to", "@-"]
p = ["git","push"]

[revset-aliases]
'why_immutable(r)' = 'r | roots(r:: & immutable_heads())'
"immutable_heads()" = "builtin_immutable_heads() | (trunk().. & ~mine()) | remote_bookmarks()"

[ui]
color = "always"
paginate = "auto"
default-command = "l"
editor = ["vim", "-u", "NONE", "-N"]


[[--scope]]
"--when.commands" = ["diff", "show", "log", "evolog", "op"]

[--scope.ui]
pager = "/Users/gnanakeethan/.config/delta/delta-auto"
diff-formatter = ":git"

[signing]
behavior = "force"
backend = "gpg"
key = "EF6F7ED0"

[git]
track-default-bookmark-on-clone = true
colocate = false

[fix.tools.gofumpt]
enabled = true
command = ["gofumpt"]
patterns = ["glob:'**/*.go'"]

[remotes.origin]
auto-track-bookmarks = "glob:*"
